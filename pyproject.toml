[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sailbill-agent"
version = "0.1.0"
description = "Shipping bill (Debit/Credit Note) understanding agent: multi-format parsing, OCR, LLM extraction, bill matching, AR/AP posting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sailbill-agent contributors" }]
keywords = ["shipping", "freight", "logistics", "langchain", "agent", "invoice", "AR-AP"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial :: Accounting",
]

dependencies = [
  "pydantic>=2.5",
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pypdf>=4.0",
  "pdfplumber>=0.11",
  "beautifulsoup4>=4.12",
  "requests>=2.31",
  "python-dotenv>=1.0",
  # 桌面单机版：本地 Web 服务
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
llm = ["langchain-openai>=0.2"]
# Outlook .msg is an OLE container; the email module cannot read it
msg = ["extract-msg>=0.48"]
# legacy .xls (BIFF) workbooks
xls = ["xlrd>=2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "Pillow>=10"]

[project.scripts]
sailbill = "sailbill.cli:main"
sailbill-desktop = "sailbill.server.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
